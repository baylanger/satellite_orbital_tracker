version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "aiohttp"
      - dependency-name: "pytest-aiohttp"
      - dependency-name: "pytest-homeassistant-custom-component"
    # Optional: assign reviewers or labels automatically
    labels:
      - "dependencies"
      - "python"
