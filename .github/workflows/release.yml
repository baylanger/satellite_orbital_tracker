name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create integration zip
        run: |
          # HACS unpacks the zip straight into custom_components/satellite_orbital_tracker/,
          # so it must contain only the integration files (manifest.json at the zip root).
          cd custom_components/satellite_orbital_tracker
          zip -r ../../satellite_orbital_tracker.zip .

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release upload "$TAG" satellite_orbital_tracker.zip --clobber
