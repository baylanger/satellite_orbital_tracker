name: Check Manifest Requirements

# manifest.json "requirements" must match requirements.txt (Home Assistant
# installs the manifest list for users). This only checks; it never pushes,
# so it works with branch rules that require pull requests.
# No "paths" filter on purpose: a path-filtered workflow does not report a
# status on other PRs, which would block merging if it is a required check.
on:
  pull_request:

jobs:
  check-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Regenerate manifest requirements from requirements.txt
        run: python .github/scripts/sync_manifest.py

      - name: Fail if manifest.json is out of sync
        run: |
          if ! git diff --exit-code custom_components/satellite_orbital_tracker/manifest.json; then
            echo "::error file=custom_components/satellite_orbital_tracker/manifest.json::manifest.json requirements do not match requirements.txt. Run 'python .github/scripts/sync_manifest.py' and commit the result."
            exit 1
          fi
